services:


  postgres:


    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:16@sha256:aed885731705b7245c0ff917ced05581234c0fb54637f2931f9ee5b1000f4244


    container_name: course_postgres


    restart: always


    environment:


      POSTGRES_USER: ${POSTGRES_USER:-course_admin}


      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}


      POSTGRES_DB: ${POSTGRES_DB:-course_system}



    ports:


      - "127.0.0.1:5432:5432"



    volumes:


      - postgres_data:/var/lib/postgresql/data





  redis:


    image: redis:7@sha256:91d0f7e8c748ec7a4c2b4fb2c4f84edab794dd91d01e095e38dc906db9d684ab


    container_name: course_redis


    restart: always

    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}


    ports:


      - "127.0.0.1:6379:6379"



    volumes:


      - redis_data:/data





volumes:


  postgres_data:


  redis_data:
